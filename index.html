<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a4d">
<meta name="description" content="El Dorado CO: live FPL points, squad and fixtures by gameweek.">
<title>El Dorado CO</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Design plan.
   Question: how many points this gameweek, and who is still to play?
   Ground: Millonarios blue, not neutral black. Panels are one tone up and separated by rules, not floating cards.
   Gold is spent in one place: the scoreboard (the number, its rule, the captain badge). Club colours are identity only.
   Type: Barlow Condensed for figures and headings, Barlow for text. Figures are tabular. */
:root {
  --ground: #0f1a4d;
  --ground-2: #13215e;
  --surface: #172870;
  --raised: #20338a;
  --raised-2: #2a419e;
  --border: rgba(214,220,255,.14);
  --rule: rgba(214,220,255,.08);
  --text: #f6f1e4;
  --muted: #b7bfe6;
  --faint: #8a95cc;
  --gold: #e8b53b;
  --gold-2: #f2c75f;
  --blue: #5a7cff;
  --blue-2: #7b97ff;
  --live: #58e0a0;
  --negative: #ff9a7a;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", Arial, sans-serif;
  --radius: 4px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--ground) radial-gradient(120% 60% at 50% -10%, #1a2d82 0%, var(--ground) 60%) no-repeat; color: var(--text);
  font: 400 15px/1.45 var(--body); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent;
}
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; touch-action: manipulation; }
button:disabled { cursor: default; opacity: .35; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1024px) { .wrap { padding-inline: 28px; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Top bar ---------- */
.bar { border-bottom: 2px solid var(--gold); padding-top: env(safe-area-inset-top, 0px); background: rgba(10,18,60,.6); backdrop-filter: blur(8px); }
.bar-in { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "brand tools" "nav nav"; gap: 10px 12px; align-items: center; padding-block: 12px; }
@media (min-width: 720px) { .bar-in { grid-template-columns: 1fr auto auto; grid-template-areas: "brand nav tools"; min-height: 72px; padding-block: 10px; gap: 28px; } }
.brand { grid-area: brand; display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { margin: 0; font: 800 26px/1 var(--display); letter-spacing: .02em; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.brand p { margin: 3px 0 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand > div { min-width: 0; }

.gwnav { grid-area: nav; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; border: 1px solid var(--border); border-radius: var(--radius); height: 44px; background: var(--ground-2); }
@media (min-width: 720px) { .gwnav { width: 280px; } }
.gwnav button { height: 42px; display: grid; place-items: center; color: var(--muted); }
.gwnav button:not(:disabled):hover { color: var(--gold); }
.gwnav:focus-within { border-color: var(--gold); }
.gwnav button:not(:disabled):active { transform: scale(.94); }
.gwsel { position: relative; height: 42px; }
.gwsel select { appearance: none; -webkit-appearance: none; width: 100%; height: 100%; background: transparent; border: 0; text-align: center; text-align-last: center; font: 700 20px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; padding: 0 18px 0 6px; }
.gwsel select option { background: var(--ground-2); color: var(--text); font: 500 15px var(--body); text-transform: none; }
.gwsel select:disabled { cursor: default; }
.gwsel::after { content: ""; position: absolute; right: 8px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.gwsel:has(select:disabled)::after { display: none; }

.tools { grid-area: tools; display: flex; align-items: center; gap: 4px; }
.stamp { font-size: 12px; color: var(--faint); margin-right: 6px; white-space: nowrap; }
@media (max-width: 479px) { .stamp { display: none; } }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); transition: background-color .15s, color .15s; }
.icon-btn:hover { background: var(--raised); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Layout ---------- */
main { display: grid; gap: 14px; padding-block: 14px calc(40px + env(safe-area-inset-bottom, 0px)); grid-template-columns: minmax(0, 1fr); grid-template-areas: "board" "season" "tabs" "team" "fx"; }
@media (min-width: 1024px) {
  main { gap: 20px; padding-block: 24px 48px; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); grid-template-areas: "board fx" "season fx" "team fx"; grid-template-rows: auto auto 1fr; }
  #fixtures { align-self: start; position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--raised-2) transparent; }
  #fixtures .panel-head { position: sticky; top: 0; z-index: 1; background: var(--surface); padding-bottom: 10px; }
  .tabs { display: none !important; }
}
@media (max-width: 1023px) {
  main[data-view="team"] #fixtures, main[data-view="fixtures"] #team { display: none; }
}
#board { grid-area: board; } #season { grid-area: season; } .tabs { grid-area: tabs; } #team { grid-area: team; } #fixtures { grid-area: fx; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; transition: opacity .2s; }
.panel[aria-busy="true"] { opacity: .45; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 20px 0; }
.panel-head h2 { margin: 0; font: 700 16px/1.1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel-head .aside { font-size: 13px; color: var(--muted); text-align: right; }
@media (max-width: 479px) { .panel-head { padding-inline: 16px; } }

/* ---------- Scoreboard ---------- */
#board { border-top: 3px solid var(--gold); background: linear-gradient(180deg, var(--raised) 0, var(--surface) 140px); }
.board { padding: 20px 22px 18px; display: grid; gap: 18px 32px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) and (max-width: 1023px), (min-width: 1360px) { .board { grid-template-columns: auto minmax(300px, 1fr); align-items: end; } .score .num { font-size: clamp(96px, 9vw, 152px); } .score .num.cd { font-size: clamp(84px, 7.5vw, 124px); } }
@media (max-width: 479px) { .board { padding: 16px; } }
.score-label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font: 700 14px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.score-label > span:first-child { white-space: nowrap; }
.score { display: flex; align-items: flex-end; gap: 16px; margin-top: 8px; }
.score .num { font: 800 clamp(104px, 28vw, 152px)/.8 var(--display); color: var(--gold); letter-spacing: -.035em; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.score .num.cd { font-size: clamp(92px, 23vw, 124px); }
.score .num small { font-size: .4em; letter-spacing: 0; margin: 0 .12em 0 .02em; color: var(--gold-2); }
.score .side { display: grid; gap: 6px; padding-bottom: 8px; font-size: 13px; color: var(--muted); }
.score .side b { color: var(--text); font: 700 22px/1 var(--display); }
.status { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1.2 var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.status::before { flex: none; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.live { color: var(--live); }
.status.live::before { animation: pulse 1.6s ease-in-out infinite; }
.status.final { color: var(--text); }
.status.final::before { background: var(--faint); }
.status.upcoming::before, .status.snapshot::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.status.offline { color: var(--negative); }
@keyframes pulse { 50% { opacity: .35; } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin: 0; align-self: stretch; align-content: end; }
.stat { padding: 10px 12px 10px 0; border-top: 1px solid var(--rule); min-width: 0; }
.stat dt { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat dd { margin: 2px 0 0; font: 700 22px/1.05 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat dd small { display: block; font: 500 12px/1 var(--body); margin-top: 3px; color: var(--muted); }
.stat dd .good { color: var(--live); } .stat dd .bad { color: var(--negative); }
.finding { grid-column: 1 / -1; margin: 0; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 15px; color: var(--muted); }
.finding b { font-weight: 600; color: var(--text); }

/* ---------- Season strip ---------- */
.season-body { padding: 12px 20px 16px; }
@media (max-width: 479px) { .season-body { padding-inline: 16px; } }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--blue); }
.legend i.avg { height: 2px; border-radius: 0; background: var(--muted); }
.strip { display: flex; gap: 4px; align-items: flex-end; height: 132px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding-top: 4px; }
.strip::-webkit-scrollbar { display: none; }
.col { flex: 1 0 26px; max-width: 64px; height: 100%; display: grid; grid-template-rows: 1fr 18px; gap: 4px; text-align: center; border-radius: 3px; }
.col .plot { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; }
.col .bar { background: var(--blue); border-radius: 2px 2px 0 0; min-height: 2px; transition: background-color .15s; }
.col .v { font: 600 12px/1 var(--display); color: var(--muted); margin-bottom: 4px; }
.col .avg { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--muted); opacity: .8; }
.col .g { font: 500 11px/18px var(--body); color: var(--faint); }
.col:hover .bar { background: var(--blue-2); }
.col[aria-current="true"] .bar { background: var(--gold); }
.col[aria-current="true"] .v { color: var(--text); }
.col[aria-current="true"] .g { color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--gold); }
.col .bar:focus-visible { outline: none; }
.col.future .bar { background: transparent; box-shadow: inset 0 0 0 1px var(--border); height: 100% !important; border-radius: 2px; }
.col.future .v { visibility: hidden; }
.empty { margin: 0; padding: 14px 16px; border: 1px dashed var(--border); border-radius: var(--radius); font-size: 14px; color: var(--muted); }
.empty button { color: var(--gold); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Tabs (phone and tablet) ---------- */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; background: var(--ground); padding-top: 2px; }
.tab { flex: 1; height: 46px; font: 700 17px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.tab small { font: 500 12px/1 var(--body); color: var(--faint); letter-spacing: 0; }
.tab[aria-selected="true"] { color: var(--gold); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--gold); }

/* ---------- Pitch ---------- */
.pitch-wrap { padding: 12px 12px 16px; }
.pitch { position: relative; border-radius: 4px; overflow: hidden; padding: 18px 4px 14px; display: grid; gap: 14px; background: #1a4a35; isolation: isolate; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.pitch > svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.line { display: flex; justify-content: space-evenly; gap: 4px; }
.pl { width: 96px; min-width: 0; flex: 0 1 96px; display: grid; justify-items: center; gap: 3px; text-align: center; }
.shirt { position: relative; width: 44px; height: 40px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.shirt svg { display: block; width: 100%; height: 100%; }
.arm { position: absolute; top: -4px; right: -10px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; font: 800 12px/18px var(--display); background: var(--gold); color: #1c1400; }
.arm.v { background: var(--text); color: var(--ground); }
.pl .nm { max-width: 100%; padding: 2px 6px; border-radius: 2px; background: var(--text); color: #0e1540; font: 600 13px/1.25 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .pt { font: 800 22px/1 var(--display); }
.pl .ctx { font-size: 12px; color: #c9dcd0; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.pl.pre .pt { font: 600 15px/22px var(--display); color: #dbe8df; }
.pl.live .ctx { color: var(--live); }
.pl.live .ctx::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pl.blank .nm { background: var(--muted); }
.pl.blank .pt { color: var(--faint); }
.pl .sub { font-size: 11px; color: var(--muted); }
.bench { margin-top: 12px; padding: 12px 4px 0; display: grid; gap: 8px; }
.bench h3 { margin: 0 0 0 8px; font: 700 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; }
.bench h3 span { font: 500 12px/1 var(--body); color: var(--faint); letter-spacing: 0; text-transform: none; }
.bench .line { background: var(--ground-2); border-radius: 4px; padding: 12px 4px 10px; }
.bench .pl .ctx { color: var(--muted); }
.bench .pl:not(.boost) .pt { color: var(--muted); }
@media (max-width: 479px) {
  .pitch-wrap { padding: 10px 8px 14px; }
  .pl { flex-basis: 70px; }
  .pl .nm { font-size: 12px; padding-inline: 4px; }
  .pl .ctx { font-size: 11px; }
  .shirt { width: 38px; height: 34px; }
}

/* ---------- Fixtures ledger ---------- */
.ledger table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 8px; }
.ledger col.c-when { width: 64px; } .ledger col.c-score { width: 64px; }
.ledger th, .ledger td { padding: 0; font-weight: 400; }
.ledger .day th { text-align: left; font: 700 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); padding: 18px 20px 8px; }
.ledger tbody:first-of-type .day th { padding-top: 10px; }
.ledger .fx td { height: 46px; border-top: 1px solid var(--rule); vertical-align: middle; }
.ledger .fx.has-picks td { border-top-color: var(--border); }
.ledger .when { padding-left: 20px !important; font: 600 15px/1 var(--display); color: var(--muted); white-space: nowrap; }
.ledger .when.live { color: var(--live); }
.ledger .when.ft { color: var(--faint); }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; font: 500 15px/1.2 var(--body); }
.team span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team.h { justify-content: flex-end; text-align: right; }
.stripe { flex: none; width: 5px; height: 22px; border-radius: 2px; overflow: hidden; display: grid; grid-template-rows: 3fr 2fr; box-shadow: 0 0 0 1px rgba(255,255,255,.22); }
.sc { text-align: center; font: 800 22px/1 var(--display); white-space: nowrap; }
.sc .dash { color: var(--faint); font-weight: 600; }
.sc.pre { font: 600 14px/1 var(--display); color: var(--faint); }
.ledger td.away { padding-right: 20px; }
.ledger .picks td { padding: 0 20px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 6px; border-radius: 3px; background: var(--raised); font: 500 13px/1 var(--body); white-space: nowrap; flex: none; }
.chip .tm { width: 3px; height: 14px; border-radius: 1px; }
.chip .arm { position: static; min-width: 16px; height: 16px; font-size: 11px; line-height: 16px; border-radius: 8px; padding: 0 3px; }
.chip b { min-width: 24px; height: 22px; padding: 0 5px; border-radius: 2px; background: var(--ground-2); font: 700 15px/22px var(--display); text-align: center; color: var(--gold-2); }
.chip.live b { color: var(--live); }
.chip.pre b { color: var(--faint); font-weight: 600; }
.chip.benched { background: transparent; box-shadow: inset 0 0 0 1px var(--border); color: var(--muted); }
.chip.benched b { color: var(--faint); }
.ledger .foot { padding: 14px 20px 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); }
@media (max-width: 479px) {
  .ledger .day th { padding-inline: 16px; }
  .ledger .when { padding-left: 16px !important; font-size: 14px; }
  .ledger col.c-when { width: 56px; } .ledger col.c-score { width: 58px; }
  .ledger td.away { padding-right: 16px; }
  .ledger .picks td { padding-inline: 16px; }
  .team { font-size: 14px; gap: 6px; }
  .ledger .foot { padding-inline: 16px; }
}
.err { margin: 16px 20px; padding: 12px 14px; border-radius: var(--radius); background: #4a2a35; color: var(--text); font-size: 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.err button { color: var(--gold); font-weight: 600; }

/* ---------- Settings sheet ---------- */
.sheet { position: fixed; inset: 0; background: rgba(4,8,30,.72); display: grid; align-items: end; z-index: 20; }
.sheet[hidden] { display: none; }
@media (min-width: 720px) { .sheet { align-items: center; } }
.card { background: var(--surface); border-top: 3px solid var(--gold); border-radius: 12px 12px 0 0; padding: 22px max(20px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; max-width: 520px; width: 100%; margin: 0 auto; box-shadow: 0 -12px 40px rgba(0,0,0,.35); }
@media (min-width: 720px) { .card { border-radius: 8px; padding: 24px; } }
.card h2 { margin: 0; font: 800 28px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.card p { margin: 0; font-size: 14px; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input { width: 100%; height: 44px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--ground); color: var(--text); font-size: 16px; }
.field input::placeholder { color: var(--faint); }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.btn { height: 44px; padding: 0 18px; border-radius: 4px; font-weight: 600; background: var(--raised); transition: background-color .15s, transform .1s; }
.btn:hover { background: var(--raised-2); }
.btn:active { transform: scale(.97); }
.btn.gold { background: var(--gold); color: #1c1400; }
.btn.gold:hover { background: var(--gold-2); }
.msg { font-size: 13px; color: var(--negative); min-height: 1.2em; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .sheet:not([hidden]) .card { animation: up .24s cubic-bezier(.2,.8,.2,1); } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .status.live::before, .icon-btn.spin svg { animation: none; } .panel { transition: none; } }
/* The font shorthand resets font-variant-numeric, so figures set with it opt back in here. */
.score .num, .score .side b, .stat dd, .col .v, .col .g, .pl .pt, .pl .ctx, .sc, .chip b, .ledger .when, .gwsel select, .stamp, .tab small, .panel-head h2 { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap bar-in">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#0f1a4d"/><path d="M64 18l34 12v30c0 22-15 38-34 48-19-10-34-26-34-48V30z" fill="none" stroke="#e3b53a" stroke-width="8"/><text x="64" y="80" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, Arial" font-weight="800" font-size="42" fill="#e3b53a">ED</text></svg>
      <div><h1 id="teamName">El Dorado CO</h1><p id="manager">Nicolas Porras</p></div>
    </div>
    <nav class="gwnav" aria-label="Gameweek">
      <button id="prevGw" aria-label="Previous gameweek"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

</div>

<script>
// ---------- Snapshot: El Dorado CO, GW8 (pre-kickoff) ----------
const SNAP = {
  gw: 8, deadline: "Fri 23 Oct, 18:30", deadlineAt: "2026-10-23T17:30:00Z", manager: "Nicolas Porras", teamName: "El Dorado CO",
  teams: { ARS:"Arsenal", AVL:"Aston Villa", BHA:"Brighton", BOU:"Bournemouth", BRE:"Brentford", CHE:"Chelsea", COV:"Coventry City", CRY:"Crystal Palace", EVE:"Everton", FUL:"Fulham", HUL:"Hull City", IPS:"Ipswich Town", LEE:"Leeds", LIV:"Liverpool", MCI:"Man City", MUN:"Man Utd", NEW:"Newcastle", NFO:"Nott'm Forest", SUN:"Sunderland", TOT:"Spurs" },
  fixtures: [
    { day:"Fri 23 Oct", time:"20:00", h:"IPS", a:"NFO" },
    { day:"Sat 24 Oct", time:"12:30", h:"AVL", a:"MCI" },
    { day:"Sat 24 Oct", time:"15:00", h:"ARS", a:"EVE" },
    { day:"Sat 24 Oct", time:"15:00", h:"COV", a:"FUL" },
    { day:"Sat 24 Oct", time:"17:30", h:"CHE", a:"TOT" },
    { day:"Sun 25 Oct", time:"14:00", h:"CRY", a:"NEW" },
    { day:"Sun 25 Oct", time:"14:00", h:"HUL", a:"BRE" },
    { day:"Sun 25 Oct", time:"14:00", h:"LIV", a:"BHA" },
    { day:"Sun 25 Oct", time:"14:00", h:"MUN", a:"BOU" },
    { day:"Sun 25 Oct", time:"16:30", h:"SUN", a:"LEE" },
  ],
  // pos: 1 GK, 2 DEF, 3 MID, 4 FWD. slot 1-11 start, 12-15 bench.
  picks: [
    { name:"Lammens", team:"MUN", pos:1, slot:1 },
    { name:"Gvardiol", team:"MCI", pos:2, slot:2 },
    { name:"Muñoz", team:"NFO", pos:2, slot:3 },
    { name:"Calafiori", team:"ARS", pos:2, slot:4 },
    { name:"Cherki", team:"MCI", pos:3, slot:5 },
    { name:"Ødegaard", team:"ARS", pos:3, slot:6 },
    { name:"Lerma", team:"CRY", pos:3, slot:7 },
    { name:"Yates", team:"NFO", pos:3, slot:8 },
    { name:"Haaland", team:"MCI", pos:4, slot:9, cap:true },
    { name:"Isak", team:"LIV", pos:4, slot:10, vice:true },
    { name:"Gyökeres", team:"ARS", pos:4, slot:11 },
    { name:"Dubravka", team:"TOT", pos:1, slot:12 },
    { name:"Thomas", team:"COV", pos:2, slot:13 },
    { name:"Gomez", team:"BHA", pos:3, slot:14 },
    { name:"Diop", team:"IPS", pos:2, slot:15 },
  ]
};

// Club colours by short name: [shirt, sleeves]. Identity only, used for shirts and row stripes.
const KIT = {
  ARS:["#EF0107","#FFFFFF"], AVL:["#7A1E3C","#95BFE5"], BOU:["#DA291C","#1A1A1A"], BRE:["#E30613","#FFFFFF"],
  BHA:["#0057B8","#FFFFFF"], BUR:["#6C1D45","#99D6EA"], CHE:["#034694","#034694"], COV:["#59CBE8","#59CBE8"],
  CRY:["#1B458F","#C4122E"], EVE:["#003399","#003399"], FUL:["#FFFFFF","#1A1A1A"], HUL:["#F5A12D","#1A1A1A"],
  IPS:["#0044A9","#FFFFFF"], LEE:["#FFFFFF","#1D428A"], LEI:["#003090","#FDBE11"], LIV:["#C8102E","#C8102E"],
  MCI:["#6CABDD","#6CABDD"], MUN:["#DA291C","#DA291C"], NEW:["#241F20","#FFFFFF"], NFO:["#DD0000","#FFFFFF"],
  SOU:["#D71920","#FFFFFF"], SUN:["#EB172B","#FFFFFF"], TOT:["#FFFFFF","#FFFFFF"], WHU:["#7A263A","#1BB1E7"],
  WOL:["#FDB913","#231F20"]
};
const kit = code => KIT[code] || ["#8f97c9","#8f97c9"];
const CHIPS = { bboost:"Bench Boost", "3xc":"Triple Captain", freehit:"Free Hit", wildcard:"Wildcard", manager:"Assistant Manager" };

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const store = { get(k){ try { return localStorage.getItem(k) || "" } catch { return "" } }, set(k,v){ try { localStorage.setItem(k,v) } catch {} } };
const fmtN = n => n == null ? "—" : Number(n).toLocaleString("en-GB");
const fmtDay = d => d.toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" });
const fmtTime = d => d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmtN(Math.abs(n));

// ---------- State ----------
// season: { teamName, manager, events:[{id, deadline, finished, avg, high}], history:{gw:{points,total,rank,overall,cost,transfers,bench}},
//           currentId, defaultGw, live:bool, offline:bool }
// view:   one gameweek, normalised (see buildView / snapshotView)
let season = null, view = null, viewGw = null, loading = false, updatedAt = null;
const gwCache = new Map();

// ---------- API through the Worker ----------
function apiBase(){ return store.get("proxy").replace(/\/$/, ""); }
async function getJSON(path, base = apiBase()){
  const r = await fetch(base + "/" + path, { cache: "no-store" });
  if(!r.ok) throw Object.assign(new Error(path + " returned " + r.status), { status: r.status });
  return r.json();
}

async function loadSeason(base, entry){
  const [boot, me, hist] = await Promise.all([
    getJSON("bootstrap-static/", base), getJSON(`entry/${entry}/`, base), getJSON(`entry/${entry}/history/`, base)
  ]);
  const teams = {}, code = {};
  boot.teams.forEach(t => { teams[t.short_name] = t.name; code[t.id] = t.short_name; });
  const el = {};
  boot.elements.forEach(e => el[e.id] = { name: e.web_name, team: code[e.team], pos: e.element_type });
  const now = Date.now();
  const events = boot.events.map(e => ({ id: e.id, deadline: e.deadline_time, open: new Date(e.deadline_time).getTime() > now,
    finished: e.finished, avg: e.average_entry_score, high: e.highest_score }));
  const history = {};
  hist.current.forEach(h => history[h.event] = { points: h.points, total: h.total_points, rank: h.rank, overall: h.overall_rank,
    cost: h.event_transfers_cost, transfers: h.event_transfers, bench: h.points_on_bench });
  const cur = boot.events.find(e => e.is_current), next = boot.events.find(e => e.is_next);
  const currentId = cur ? cur.id : 0;
  // Open on the live week; once it is over, move on to the next week's fixtures.
  const defaultGw = cur && !(cur.finished && next) ? cur.id : next ? next.id : currentId;
  const chips = {}; hist.chips.forEach(c => chips[c.event] = c.name);
  return { teamName: me.name, manager: `${me.player_first_name} ${me.player_last_name}`, entry, teams, code, el, events,
    history, chips, currentId, maxGw: next ? next.id : currentId, defaultGw, live: true };
}

async function loadGw(gw, { fresh = false } = {}){
  const key = gw;
  if(!fresh && gwCache.has(key)) return gwCache.get(key);
  const ev = season.events.find(e => e.id === gw);
  const entry = season.entry;
  // Before the deadline there are no picks for this week; show the latest saved team instead.
  const picksGw = ev.open ? season.currentId : gw;
  const [fixtures, live, picks] = await Promise.all([
    getJSON(`fixtures/?event=${gw}`),
    ev.open ? Promise.resolve({ elements: [] }) : getJSON(`event/${gw}/live/`),
    picksGw ? getJSON(`entry/${entry}/event/${picksGw}/picks/`).catch(err => { if(err.status === 404) return null; throw err; }) : Promise.resolve(null)
  ]);
  const v = buildView(gw, ev, fixtures, live, picks, picksGw);
  if(ev.finished) gwCache.set(key, v);
  return v;
}

function buildView(gw, ev, fixtures, live, picks, picksGw){
  const { code, el } = season;
  const liveById = {}; live.elements.forEach(e => liveById[e.id] = e);
  const fx = fixtures.filter(f => f.kickoff_time).sort((a,b) => new Date(a.kickoff_time) - new Date(b.kickoff_time) || a.id - b.id).map(f => {
    const d = new Date(f.kickoff_time);
    const state = !f.started ? "pre" : (f.finished || f.finished_provisional) ? "ft" : "live";
    return { id: f.id, day: fmtDay(d), time: fmtTime(d), h: code[f.team_h], a: code[f.team_a],
      hs: f.started ? f.team_h_score : null, as: f.started ? f.team_a_score : null, state, minute: f.minutes };
  });
  const out = { gw, deadline: fmtDay(new Date(ev.deadline)) + ", " + fmtTime(new Date(ev.deadline)), deadlineAt: ev.deadline, fixtures: fx, picks: [],
    status: ev.open ? "upcoming" : ev.finished ? "final" : "live", picksGw, noPicks: !picks,
    chip: picks?.active_chip || null, avg: ev.avg || null, high: ev.high ?? null };
  if(!picks) return out;
  const subsIn = new Set((picks.automatic_subs || []).map(s => s.element_in));
  const subsOut = new Set((picks.automatic_subs || []).map(s => s.element_out));
  out.picks = picks.picks.map(p => {
    const e = el[p.element] || { name: "#" + p.element, team: "", pos: p.element_type };
    const l = liveById[p.element];
    const myFx = fx.filter(f => f.h === e.team || f.a === e.team);
    const perFx = {};
    (l?.explain || []).forEach(x => perFx[x.fixture] = x.stats.reduce((s, st) => s + st.points, 0));
    const started = myFx.filter(f => f.state !== "pre"), done = myFx.filter(f => f.state === "ft");
    const state = !myFx.length ? "blank" : myFx.some(f => f.state === "live") ? "live" : done.length === myFx.length ? "ft" : started.length ? "part" : "pre";
    const mult = ev.open ? (p.position <= 11 ? (p.is_captain ? 2 : 1) : 0) : p.multiplier;
    return { id: p.element, name: e.name, team: e.team, pos: e.element_type ?? e.pos, slot: p.position, cap: p.is_captain, vice: p.is_vice_captain,
      mult, raw: l ? l.stats.total_points : null, minutes: l ? l.stats.minutes : 0, perFx, fx: myFx.map(f => f.id), state,
      subIn: subsIn.has(p.element), subOut: subsOut.has(p.element) };
  });
  return out;
}

function snapshotView(){
  const fixtures = SNAP.fixtures.map((f, i) => ({ id: i + 1, day: f.day, time: f.time, h: f.h, a: f.a, hs: null, as: null, state: "pre" }));
  const picks = SNAP.picks.map(p => {
    const myFx = fixtures.filter(f => f.h === p.team || f.a === p.team);
    return { id: p.slot, name: p.name, team: p.team, pos: p.pos, slot: p.slot, cap: !!p.cap, vice: !!p.vice,
      mult: p.slot <= 11 ? (p.cap ? 2 : 1) : 0, raw: null, minutes: 0, perFx: {}, fx: myFx.map(f => f.id), state: myFx.length ? "pre" : "blank" };
  });
  return { gw: SNAP.gw, deadline: SNAP.deadline, deadlineAt: SNAP.deadlineAt, fixtures, picks, status: "upcoming", picksGw: SNAP.gw, avg: null, high: null, chip: null };
}
function snapshotSeason(){
  return { teamName: SNAP.teamName, manager: SNAP.manager, teams: SNAP.teams, events: [{ id: SNAP.gw }], history: {}, chips: {},
    currentId: SNAP.gw - 1, maxGw: SNAP.gw, defaultGw: SNAP.gw, live: false, snapshot: true };
}

// ---------- Derived figures ----------
function figures(v){
  const h = season.history[v.gw];
  const starters = v.picks.filter(p => p.mult > 0);
  const computed = v.picks.reduce((s, p) => s + (p.raw || 0) * p.mult, 0);
  const points = v.status === "upcoming" ? null : v.status === "final" && h ? h.points : computed;
  const played = starters.filter(p => p.state === "ft" || p.state === "blank" || p.minutes > 0).length;
  const prev = season.history[v.gw - 1];
  const overallMove = h && prev && h.overall && prev.overall ? prev.overall - h.overall : null;
  return { h, points, played, starters: starters.length, overallMove };
}
const teamName = c => season.teams[c] || c || "—";
function fixtureLabel(p, v){
  const f = v.fixtures.filter(x => p.fx.includes(x.id));
  if(!f.length) return "No fixture";
  return f.map(x => x.h === p.team ? x.a + " (H)" : x.h + " (A)").join(", ");
}
function pickPts(p){ return p.raw == null ? null : p.raw * (p.mult || 1); }

// ---------- Rendering ----------
function render(){
  const v = view, F = figures(v);
  document.title = `${season.teamName} · GW${v.gw}`;
  $("#teamName").textContent = season.teamName;
  $("#manager").textContent = season.manager;
  renderNav();
  renderBoard(v, F);
  renderSeason(v);
  renderTeam(v);
  renderFixtures(v);
}

function renderNav(){
  const sel = $("#gwSelect");
  const max = season.maxGw || viewGw;
  let opts = "";
  for(let g = 1; g <= max; g++){
    const h = season.history[g];
    if(season.snapshot && g !== viewGw) continue;
    opts += `<option value="${g}" ${g === viewGw ? "selected" : ""}>${h ? `GW ${g} · ${h.points} pts` : `Gameweek ${g}`}</option>`;
  }
  sel.innerHTML = opts;
  sel.disabled = !!season.snapshot;
  $("#prevGw").disabled = season.snapshot || viewGw <= 1;
  $("#nextGw").disabled = season.snapshot || viewGw >= max;
  $("#refresh").hidden = !season.live;
  $("#stamp").textContent = season.offline ? "Offline" : updatedAt ? "Updated " + fmtTime(updatedAt) : "";
}

function statusOf(v){
  if(season.offline) return ["offline", "Offline, last saved"];
  if(season.snapshot) return ["snapshot", "Snapshot · deadline " + v.deadline];
  if(v.status === "upcoming") return ["upcoming", "Deadline " + v.deadline];
  if(v.status === "final") return ["final", "Final"];
  const liveNow = v.fixtures.some(f => f.state === "live");
  return ["live", liveNow ? "Live" : "In progress"];
}

function renderBoard(v, F){
  const [cls, label] = statusOf(v);
  const h = F.h;
  const upcoming = v.status === "upcoming";
  const cap = v.picks.find(p => p.cap), capFx = cap ? fixtureLabel(cap, v) : "";
  const chipName = v.chip ? (CHIPS[v.chip] || v.chip) : null;
  const move = F.overallMove;
  const stats = upcoming ? [
      ["Captain", cap ? esc(cap.name) : "—"],
      ["Opponent", esc(capFx || "—")],
      ["First game", esc(firstKickoff(v))],
      ["Season pts", h ? fmtN(h.total) : fmtN(season.history[season.currentId]?.total)],
      ["Overall rank", fmtN(season.history[season.currentId]?.overall)],
      ["Chip", chipName ? esc(chipName) : "None"],
    ] : [
      ["Gameweek rank", fmtN(h?.rank)],
      ["Overall rank", fmtN(h?.overall) + (move ? `<small class="${move > 0 ? "good" : "bad"}">${move > 0 ? "▲" : "▼"} ${fmtN(Math.abs(move))}</small>` : "")],
      ["Average", v.avg ? fmtN(v.avg) : "—"],
      ["Highest", v.high ? fmtN(v.high) : "—"],
      ["Bench", fmtN(h ? h.bench : v.picks.filter(p => p.mult === 0).reduce((s, p) => s + (p.raw || 0), 0))],
      ["Transfers", h ? `${h.transfers}${h.cost ? `<small class="bad">−${h.cost}</small>` : ""}` : "—"],
    ];
  $("#board").innerHTML = `
    <div>
      <div class="score-label"><span>Gameweek ${v.gw}</span><span class="status ${cls}">${esc(label)}</span></div>
      <div class="score">
        <div class="num ${upcoming ? "cd" : ""}" id="scoreNum">${upcoming ? countdown(v) : F.points}</div>
        <div class="side">${upcoming
          ? `<span>${Date.parse(v.deadlineAt) > Date.now() ? "to the deadline" : "deadline passed"}</span><span><b>${F.starters}</b> starters</span>`
          : `<span><b>${F.played}</b>/${F.starters} played</span><span>points${chipName ? " · " + esc(chipName) : ""}</span>`}</div>
      </div>
    </div>
    <dl class="stats">${stats.map(([k, val]) => `<div class="stat"><dt>${k}</dt><dd>${val}</dd></div>`).join("")}</dl>
    <p class="finding">${finding(v, F)}</p>`;
}

function firstKickoff(v){
  const f = v.fixtures.find(x => v.picks.some(p => p.mult > 0 && p.fx.includes(x.id)));
  return f ? `${f.day.split(" ")[0]} ${f.time}` : "—";
}
function countdown(v){
  const ms = Date.parse(v.deadlineAt) - Date.now();
  if(!(ms > 0)) return "0<small>m</small>";
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? `${d}<small>d</small>${h}<small>h</small>` : h ? `${h}<small>h</small>${String(mm).padStart(2, "0")}<small>m</small>` : `${mm}<small>m</small>`;
}

function finding(v, F){
  const cap = v.picks.find(p => p.cap);
  if(v.noPicks) return `No team saved for gameweek ${v.gw}. Fixtures only.`;
  if(v.status === "upcoming"){
    const borrowed = !season.snapshot && v.picksGw && v.picksGw !== v.gw ? ` Showing your gameweek ${v.picksGw} team; transfers made since then show after the deadline.` : "";
    const starters = v.picks.filter(p => p.mult > 0), blanks = starters.filter(p => p.state === "blank");
    return `Deadline <b>${esc(v.deadline)}</b>. ${blanks.length ? `<b>${blanks.length}</b> starter${blanks.length > 1 ? "s have" : " has"} no fixture: ${esc(blanks.map(p => p.name).join(", "))}.` : `All ${starters.length} starters have a fixture.`}${borrowed}`;
  }
  if(v.status === "live"){
    const left = v.picks.filter(p => p.mult > 0 && (p.state === "pre" || p.state === "part"));
    const playing = v.picks.filter(p => p.mult > 0 && p.state === "live");
    const nextUp = left.map(p => ({ p, f: v.fixtures.find(f => p.fx.includes(f.id) && f.state === "pre") })).filter(x => x.f)[0];
    if(!left.length && !playing.length) return `All your starters have played. <b>${F.points}</b> points, waiting on bonus and final checks.`;
    return `<b>${playing.length}</b> playing now, <b>${left.length}</b> still to play.${nextUp ? ` Next: <b>${esc(nextUp.p.name)}</b>, ${esc(nextUp.f.day.split(" ")[0])} ${esc(nextUp.f.time)}.` : ""}`;
  }
  const diff = v.avg ? F.points - v.avg : null;
  const top = [...v.picks].filter(p => p.mult > 0).sort((a, b) => pickPts(b) - pickPts(a))[0];
  const move = F.overallMove;
  return `${diff != null ? `<b>${signed(diff)}</b> on the average of ${v.avg}.` : ""}${top ? ` Best: <b>${esc(top.name)}</b> ${pickPts(top)}${top.cap ? " (captain)" : ""}.` : ""}${move ? ` Overall rank ${move > 0 ? "up" : "down"} ${fmtN(Math.abs(move))} on gameweek ${v.gw - 1}.` : ""}`;
}

function renderSeason(v){
  const el = $("#season");
  if(season.snapshot){
    el.innerHTML = `<div class="panel-head"><h2 id="seasonTitle">Season</h2></div>
      <div class="season-body"><p class="empty">Points by gameweek appear here once you go live. <button type="button" data-open-settings>Add your Worker URL</button></p></div>`;
    return;
  }
  const gws = [];
  for(let g = 1; g <= season.maxGw; g++) gws.push(g);
  const ev = id => season.events.find(e => e.id === id);
  // A live week has no history row yet: draw its running total.
  const pointsFor = g => season.history[g]?.points ?? (g === v.gw && v.status === "live" ? figures(v).points : null);
  const vals = gws.map(g => pointsFor(g) ?? 0).concat(gws.map(g => ev(g)?.avg || 0));
  const top = Math.max(40, Math.ceil(Math.max(...vals) / 20) * 20);
  const total = season.history[season.currentId]?.total;
  el.innerHTML = `<div class="panel-head"><h2 id="seasonTitle">Season${total != null ? ` · ${fmtN(total)} pts` : ""}</h2>
      <div class="legend"><span><i></i>Your points</span><span><i class="avg"></i>Average</span></div></div>
    <div class="season-body"><div class="strip" role="list">${gws.map(g => {
      const pts = pointsFor(g), e = ev(g), future = pts == null;
      const pct = !future ? Math.max(1.5, (pts / top) * 100) : 100;
      const avg = e && e.avg && !future ? (e.avg / top) * 100 : null;
      return `<button type="button" role="listitem" class="col ${future ? "future" : ""}" data-gw="${g}" aria-current="${g === viewGw}" aria-label="Gameweek ${g}${!future ? `: ${pts} points` : ""}${avg != null ? `, average ${e.avg}` : ""}">
        <span class="plot"><span class="v">${!future ? pts : ""}</span><span class="bar" style="height:${pct}%"></span>${avg != null ? `<span class="avg" style="bottom:${avg}%"></span>` : ""}</span>
        <span class="g">${g}</span></button>`;
    }).join("")}</div></div>`;
  const cur = el.querySelector('[aria-current="true"]');
  if(cur){ const s = el.querySelector(".strip"); s.scrollLeft = cur.offsetLeft - s.clientWidth / 2 + cur.clientWidth / 2; }
}

function shirtSvg(team, gk){
  const [body, sleeve] = gk ? ["#C5D932", "#1A1A1A"] : kit(team);
  return `<svg viewBox="0 0 44 40" aria-hidden="true"><path d="M15 2 L5 7 L1 16 L8 19 L10 15 L10 38 L34 38 L34 15 L36 19 L43 16 L39 7 L29 2 Q22 8 15 2Z" fill="${body}" stroke="rgba(255,255,255,.45)" stroke-width="1"/><path d="M5 7 L1 16 L8 19 L10 15 L10 10Z M39 7 L43 16 L36 19 L34 15 L34 10Z" fill="${sleeve}" stroke="rgba(255,255,255,.45)" stroke-width="1"/><path d="M15 2 Q22 8 29 2" fill="none" stroke="rgba(10,14,40,.5)" stroke-width="1.5"/></svg>`;
}

function player(p, v){
  const pts = pickPts(p);
  const f = v.fixtures.filter(x => p.fx.includes(x.id));
  let ctx = "", cls = p.state;
  if(p.state === "blank") ctx = "No fixture";
  else if(p.state === "pre") ctx = `${f[0].day.split(" ")[0]} ${f[0].time}`;
  else if(p.state === "live") ctx = (f.find(x => x.state === "live")?.minute ?? "") + "'";
  else if(p.state === "part") ctx = "1 of " + f.length + " played";
  else ctx = p.minutes > 0 ? p.minutes + " min" : "Didn't play";
  const shown = p.state === "pre" || (v.status === "upcoming") ? fixtureLabel(p, v) : pts ?? 0;
  return `<div class="pl ${cls} ${v.status === "upcoming" ? "pre" : ""} ${p.mult > 0 && p.slot > 11 ? "boost" : ""}">
    <div class="shirt">${shirtSvg(p.team, p.pos === 1)}${p.cap ? `<span class="arm">${p.mult === 3 ? "TC" : "C"}</span>` : p.vice ? '<span class="arm v">V</span>' : ""}</div>
    <div class="nm" title="${esc(p.name)}">${esc(p.name)}</div>
    <div class="pt">${esc(shown)}</div>
    <div class="ctx">${esc(ctx)}${p.subIn ? " · on" : p.subOut ? " · off" : ""}</div>
  </div>`;
}

function pitchSvg(){
  // Mowing stripes and markings, drawn in tone steps of the ground.
  let stripes = "";
  for(let i = 0; i < 8; i++) if(i % 2) stripes += `<rect x="0" y="${i * 12.5}%" width="100%" height="12.5%" fill="#1f533c"/>`;
  return `<svg preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true">${stripes}
    <g fill="none" stroke="rgba(255,255,255,.13)" stroke-width="1.2" vector-effect="non-scaling-stroke">
      <rect x="2" y="1.5" width="96" height="97" vector-effect="non-scaling-stroke"/>
      <rect x="24" y="1.5" width="52" height="17" vector-effect="non-scaling-stroke"/>
      <rect x="38" y="1.5" width="24" height="6" vector-effect="non-scaling-stroke"/>
      <line x1="2" y1="98.5" x2="98" y2="98.5" vector-effect="non-scaling-stroke"/>
    </g></svg>`;
}

function renderTeam(v){
  const el = $("#team");
  if(v.noPicks || !v.picks.length){
    el.innerHTML = `<div class="panel-head"><h2 id="teamTitle">Team</h2></div><div class="season-body"><p class="empty">No team saved for gameweek ${v.gw}.</p></div>`;
    return;
  }
  const starters = v.picks.filter(p => p.slot <= 11);
  const bench = v.picks.filter(p => p.slot > 11).sort((a, b) => a.slot - b.slot);
  const lines = [1, 2, 3, 4].map(pos => starters.filter(p => p.pos === pos));
  const shape = lines.slice(1).map(l => l.length).join("-");
  const benchPts = bench.reduce((s, p) => s + (p.raw || 0), 0);
  const boost = v.chip === "bboost";
  el.innerHTML = `<div class="panel-head"><h2 id="teamTitle">Team</h2><span class="aside">${shape}${v.chip ? " · " + esc(CHIPS[v.chip] || v.chip) : ""}</span></div>
    <div class="pitch-wrap">
      <div class="pitch">${pitchSvg()}${lines.map(l => `<div class="line">${l.map(p => player(p, v)).join("")}</div>`).join("")}</div>
      <div class="bench"><h3>Bench${v.status === "upcoming" ? "" : ` <span>${boost ? "counting, Bench Boost" : benchPts + " pts not counted"}</span>`}</h3>
        <div class="line">${bench.map(p => player(p, v)).join("")}</div></div>
    </div>`;
}

function renderFixtures(v){
  const el = $("#fixtures");
  const byDay = new Map();
  v.fixtures.forEach(f => { if(!byDay.has(f.day)) byDay.set(f.day, []); byDay.get(f.day).push(f); });
  const n = { live: 0, ft: 0, pre: 0 };
  v.fixtures.forEach(f => n[f.state]++);
  const summary = [n.live && `${n.live} live`, n.ft && `${n.ft} finished`, n.pre && `${n.pre} to come`].filter(Boolean).join(" · ");
  $("#fxCount").textContent = n.live ? n.live + " live" : v.fixtures.length;
  let rows = "";
  for(const [day, list] of byDay){
    rows += `<tbody><tr class="day"><th colspan="4" scope="colgroup">${esc(day)}</th></tr>`;
    for(const f of list){
      const mine = v.picks.filter(p => p.fx.includes(f.id)).sort((a, b) => a.slot - b.slot);
      const when = f.state === "pre" ? f.time : f.state === "live" ? (f.minute ?? 0) + "'" : "FT";
      const sc = f.state === "pre" ? `<td class="sc pre">v</td>` : `<td class="sc">${f.hs}<span class="dash">–</span>${f.as}</td>`;
      rows += `<tr class="fx ${mine.length ? "has-picks" : ""}">
        <td class="when ${f.state}">${when}</td>
        <td><div class="team h"><span>${esc(teamName(f.h))}</span>${stripe(f.h)}</div></td>
        ${sc}
        <td class="away"><div class="team">${stripe(f.a)}<span>${esc(teamName(f.a))}</span></div></td></tr>`;
      if(mine.length) rows += `<tr class="picks"><td colspan="4"><div class="chips">${mine.map(p => chip(p, f)).join("")}</div></td></tr>`;
    }
    rows += `</tbody>`;
  }
  const mineCount = v.fixtures.filter(f => v.picks.some(p => p.mult > 0 && p.fx.includes(f.id))).length;
  el.innerHTML = `<div class="panel-head"><h2 id="fxTitle">Fixtures</h2><span class="aside">${summary}</span></div>
    ${v.fixtures.length ? `<table><colgroup><col class="c-when"><col><col class="c-score"><col></colgroup>
      <thead class="sr"><tr><th scope="col">Kick-off</th><th scope="col">Home</th><th scope="col">Score</th><th scope="col">Away</th></tr></thead>${rows}</table>
    <div class="foot">${v.picks.length ? `Your starters feature in ${mineCount} of ${v.fixtures.length} fixtures. Points shown per match, captain doubled.` : "No team saved for this week."}</div>`
    : `<div class="season-body"><p class="empty">No fixtures scheduled for gameweek ${v.gw}.</p></div>`}`;
}
function stripe(code){
  const [a, b] = kit(code);
  return `<i class="stripe" aria-hidden="true"><b style="background:${a}"></b><b style="background:${b}"></b></i>`;
}
function chip(p, f){
  const raw = p.perFx[f.id];
  const pts = f.state === "pre" ? "–" : (raw ?? 0) * (p.mult || 1);
  const st = f.state === "pre" ? "pre" : f.state === "live" ? "live" : "";
  return `<span class="chip ${st} ${p.mult === 0 ? "benched" : ""}"><i class="tm" style="background:${kit(p.team)[0]}"></i>${p.cap ? `<span class="arm">${p.mult === 3 ? "TC" : "C"}</span>` : p.vice ? '<span class="arm v">V</span>' : ""}${esc(p.name)}<b>${pts}</b></span>`;
}

function renderError(err){
  const msg = `<div class="err" role="alert"><span>Couldn't load gameweek ${viewGw}. ${esc(err.message || "")}</span><button type="button" id="retry">Retry</button></div>`;
  $("#fixtures").insertAdjacentHTML("afterbegin", msg);
  $("#retry")?.addEventListener("click", () => go(viewGw, { fresh: true }));
}

// ---------- Flow ----------
function setBusy(b){
  loading = b;
  ["#board", "#season", "#team", "#fixtures"].forEach(s => $(s).setAttribute("aria-busy", b));
  $("#refresh").classList.toggle("spin", b);
}

async function go(gw, opts = {}){
  if(!season || season.snapshot) return;
  gw = Math.max(1, Math.min(season.maxGw, gw));
  viewGw = gw;
  setBusy(true);
  try {
    view = await loadGw(gw, opts);
    updatedAt = new Date();
    season.offline = false;
    if(gw === season.defaultGw) store.set("lastLive", JSON.stringify({ season: { ...season, el: undefined }, view, updatedAt }));
    history.replaceState(null, "", gw === season.defaultGw ? location.pathname : "#gw=" + gw);
    render();
  } catch (err) {
    console.warn(err);
    renderNav();
    renderError(err);
  } finally { setBusy(false); }
}

async function boot(){
  const base = store.get("proxy"), entry = store.get("entry");
  if(base && entry){
    setBusy(true);
    try {
      season = await loadSeason(base.replace(/\/$/, ""), entry);
      gwCache.clear();
      const linked = +(location.hash.match(/gw=(\d+)/) || [])[1];
      const want = viewGw || linked;
      await go(want >= 1 && want <= season.maxGw ? want : season.defaultGw);
      return;
    } catch (err) {
      console.warn(err);
      const cached = store.get("lastLive");
      if(cached){
        const c = JSON.parse(cached);
        season = { ...c.season, live: false, offline: true }; view = c.view; viewGw = view.gw; updatedAt = c.updatedAt ? new Date(c.updatedAt) : null;
        setBusy(false); render(); return;
      }
    } finally { setBusy(false); }
  }
  season = snapshotSeason(); view = snapshotView(); viewGw = view.gw; updatedAt = null;
  render();
}

// ---------- UI wiring ----------
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  document.querySelector("main").dataset.view = t.dataset.view;
}));
$("#prevGw").addEventListener("click", () => go(viewGw - 1));
$("#nextGw").addEventListener("click", () => go(viewGw + 1));
$("#gwSelect").addEventListener("change", e => go(+e.target.value));
$("#refresh").addEventListener("click", () => go(viewGw, { fresh: true }));
$("#season").addEventListener("click", e => { const c = e.target.closest(".col"); if(c) go(+c.dataset.gw); });
document.addEventListener("keydown", e => {
  if(e.target.closest("input, select, textarea") || !$("#sheet").hidden) return;
  if(e.key === "ArrowLeft") go(viewGw - 1);
  if(e.key === "ArrowRight") go(viewGw + 1);
});
function openSettings(){
  $("#proxy").value = store.get("proxy"); $("#entry").value = store.get("entry"); $("#msg").textContent = "";
  $("#sheet").hidden = false; $("#proxy").focus();
}
$("#openSettings").addEventListener("click", openSettings);
document.addEventListener("click", e => { if(e.target.closest("[data-open-settings]")) openSettings(); });
$("#sheet").addEventListener("click", e => { if(e.target === $("#sheet")) $("#sheet").hidden = true; });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#sheet").hidden = true; });
$("#useSnapshot").addEventListener("click", () => { store.set("proxy",""); store.set("entry",""); store.set("lastLive",""); $("#sheet").hidden = true; viewGw = null; boot(); });
$("#settingsForm").addEventListener("submit", async e => {
  e.preventDefault();
  const base = $("#proxy").value.trim().replace(/\/$/, ""), entry = $("#entry").value.trim();
  if(!/^https?:\/\//.test(base) || !/^\d+$/.test(entry)){ $("#msg").textContent = "Enter a full Worker URL and a numeric manager ID."; return; }
  $("#msg").textContent = "Connecting…";
  try {
    await getJSON(`entry/${entry}/`, base);
    store.set("proxy", base); store.set("entry", entry);
    $("#sheet").hidden = true; viewGw = null; boot();
  } catch (err) { $("#msg").textContent = "Could not reach the API through that Worker. Check the URL, the manager ID and that the Worker is deployed."; }
});

boot();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// Refresh every 60 s while a live gameweek is open
setInterval(() => { if(season?.live && view?.status === "live" && !loading && !document.hidden) go(viewGw, { fresh: true }); }, 60000);
// Keep the deadline countdown current
setInterval(() => { if(view?.status === "upcoming" && $("#scoreNum")) $("#scoreNum").innerHTML = countdown(view); }, 30000);
</script>
</body>
