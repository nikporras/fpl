<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14205c">
<title>FPL</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Design plan.
   Layout: a scoreboard header (your live total, big) over a match-day ledger grouped by kickoff slot,
   each fixture stamped with your players and their points. Left-aligned, phone-first, one column.
   Color: Millonarios blue ground, El Dorado gold as the single accent, warm white text.
   Type: Barlow Condensed for numbers and headings (stadium scoreboard), Barlow for everything else. */
:root {
  --ground: #14205c;
  --ground-2: #1b2a74;
  --panel: #223291;
  --ink: #f7f3e8;
  --ink-dim: #b9bfe3;
  --gold: #e3b53a;
  --gold-deep: #b8891a;
  --live: #4ad38a;
  --warn: #ff8a65;
  --line: rgba(247,243,232,.12);
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground); color: var(--ink); font: 400 15px/1.45 var(--body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 640px; margin: 0 auto; }

/* Scoreboard */
.board { background: linear-gradient(180deg, var(--ground-2), var(--ground)); border-bottom: 2px solid var(--gold); padding-block: 18px 16px; }
.board .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font: 800 22px/1 var(--display); letter-spacing: .02em; color: var(--gold); }
.brand small { display: block; font: 500 12px/1.2 var(--body); color: var(--ink-dim); letter-spacing: 0; margin-top: 3px; }
.gear { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-dim); }
.gear:hover { background: rgba(255,255,255,.06); color: var(--ink); }
.score { display: grid; grid-template-columns: auto 1fr; gap: 0 20px; align-items: end; margin-top: 18px; }
.score .num { font: 800 clamp(64px, 20vw, 88px)/0.9 var(--display); color: var(--ink); letter-spacing: -.02em; }
.score .meta { display: grid; gap: 4px; padding-bottom: 8px; font-size: 14px; color: var(--ink-dim); }
.score .meta b { color: var(--ink); font-weight: 600; }
.status { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); color: var(--live); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.snap { color: var(--gold); }
.status.off { color: var(--warn); }
.subrow { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--ink-dim); flex-wrap: wrap; }
.subrow b { color: var(--ink); font: 600 16px/1 var(--display); margin-right: 4px; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); }
.tab { padding: 10px 14px; font: 600 15px/1 var(--display); letter-spacing: .04em; color: var(--ink-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; text-transform: uppercase; }
.tab[aria-selected="true"] { color: var(--gold); border-color: var(--gold); }

/* Ledger */
main { padding-block: 16px 40px; }
.slot { margin-top: 18px; }
.slot h2 { margin: 0 0 8px; font: 600 14px/1 var(--display); letter-spacing: .06em; color: var(--ink-dim); text-transform: uppercase; display: flex; justify-content: space-between; }
.fx { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.fx .team { font: 500 15px/1.2 var(--body); min-width: 0; }
.fx .team.a { text-align: right; }
.fx .mid { font: 800 22px/1 var(--display); min-width: 64px; text-align: center; color: var(--ink); }
.fx .mid small { display: block; font: 500 11px/1.4 var(--body); color: var(--ink-dim); }
.fx .mid.live small { color: var(--live); }
.fx.mine { background: linear-gradient(90deg, rgba(227,181,58,.10), transparent 60%); margin-inline: -8px; padding-inline: 8px; border-radius: 6px; border-top-color: transparent; }
.fx .picks { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; border-radius: 4px; background: var(--panel); font-size: 13px; font-weight: 500; }
.pick .pts { font: 800 15px/1 var(--display); color: var(--gold); min-width: 14px; text-align: right; }
.pick.bench { opacity: .55; background: transparent; border: 1px solid var(--line); }
.pick .cap { font: 800 10px/1 var(--display); padding: 2px 4px; border-radius: 3px; background: var(--gold); color: var(--ground); }
.pick .cap.v { background: var(--ink-dim); }
.fx .none { grid-column: 1 / -1; font-size: 12px; color: var(--ink-dim); }

/* Squad */
.pitch { display: grid; gap: 14px; margin-top: 14px; }
.row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.shirt { width: 86px; text-align: center; display: grid; gap: 4px; justify-items: center; }
.shirt .p { width: 44px; height: 44px; border-radius: 50% 50% 8px 8px; background: var(--panel); display: grid; place-items: center; font: 800 20px/1 var(--display); color: var(--gold); position: relative; }
.shirt .p .cap { position: absolute; top: -4px; right: -4px; font: 800 10px/1 var(--display); padding: 3px 5px; border-radius: 3px; background: var(--gold); color: var(--ground); }
.shirt .p .cap.v { background: var(--ink-dim); }
.shirt .n { font-size: 12px; font-weight: 600; line-height: 1.1; }
.shirt .f { font-size: 11px; color: var(--ink-dim); }
.benchline { margin-top: 20px; padding-top: 12px; border-top: 1px dashed var(--line); }
.benchline h3 { margin: 0 0 10px; font: 600 13px/1 var(--display); letter-spacing: .06em; color: var(--ink-dim); text-transform: uppercase; }
.benchline .shirt .p { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); }

/* Settings sheet */
.sheet { position: fixed; inset: 0; background: rgba(8,12,40,.7); display: grid; align-items: end; z-index: 20; }
.sheet[hidden] { display: none; }
.card { background: var(--ground-2); border-radius: 16px 16px 0 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; max-width: 640px; width: 100%; margin: 0 auto; }
.card h2 { margin: 0; font: 800 24px/1 var(--display); }
.card p { margin: 0; font-size: 13px; color: var(--ink-dim); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--ground); color: var(--ink); font: inherit; }
.actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn { padding: 10px 16px; border-radius: 6px; font-weight: 600; background: var(--panel); }
.btn.gold { background: var(--gold); color: var(--ground); }
.msg { font-size: 13px; color: var(--warn); min-height: 1.2em; }
@media (prefers-reduced-motion: no-preference) { .sheet .card { animation: up .22s ease-out; } }
@keyframes up { from { transform: translateY(24px); opacity: 0 } }
</style>
</head>
<body>

<header class="board gutter">
  <div class="wrap">
    <div class="top">
      <div class="brand"><span id="teamName">El Dorado CO</span><small id="manager">Nicolas Porras</small></div>
      <button class="gear" id="openSettings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="score">
      <div class="num" id="total">0</div>
      <div class="meta">
        <span class="status snap" id="status">Snapshot</span>
        <span><b id="gwLabel">Gameweek 8</b></span>
        <span id="deadline">Deadline Fri 23 Oct, 18:30</span>
      </div>
    </div>
    <div class="subrow">
      <span><b id="played">0</b>played</span>
      <span><b id="toPlay">11</b>to play</span>
      <span><b id="capName">Haaland</b>captain</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="fixtures">Fixtures</button>
      <button class="tab" role="tab" aria-selected="false" data-view="squad">Squad</button>
    </div>
  </div>
</header>

<main class="gutter"><div class="wrap">
  <section id="fixtures"></section>
  <section id="squad" hidden></section>
</div></main>

<div class="sheet" id="sheet" hidden>
  <form class="card" id="settingsForm">
    <h2>Settings</h2>
    <p>Add your Cloudflare Worker URL and FPL manager ID to switch from the snapshot to live data. Both are saved on this device only.</p>
    <div class="field"><label for="proxy">Worker URL</label><input id="proxy" placeholder="https://fpl-proxy.yourname.workers.dev" inputmode="url"></div>
    <div class="field"><label for="entry">Manager ID</label><input id="entry" placeholder="The number in your FPL points URL" inputmode="numeric"></div>
    <div class="msg" id="msg"></div>
    <div class="actions">
      <button type="button" class="btn" id="useSnapshot">Use snapshot</button>
      <button type="submit" class="btn gold">Go live</button>
    </div>
  </form>
</div>

<script>
// ---------- Snapshot: El Dorado CO, GW8 (pre-kickoff) ----------
const SNAP = {
  gw: 8, deadline: "Fri 23 Oct, 18:30", manager: "Nicolas Porras", teamName: "El Dorado CO",
  teams: { ARS:"Arsenal", AVL:"Aston Villa", BHA:"Brighton", BOU:"Bournemouth", BRE:"Brentford", CHE:"Chelsea", COV:"Coventry City", CRY:"Crystal Palace", EVE:"Everton", FUL:"Fulham", HUL:"Hull City", IPS:"Ipswich Town", LEE:"Leeds", LIV:"Liverpool", MCI:"Man City", MUN:"Man Utd", NEW:"Newcastle", NFO:"Nott'm Forest", SUN:"Sunderland", TOT:"Spurs" },
  fixtures: [
    { day:"Fri 23 Oct", time:"20:00", h:"IPS", a:"NFO", tv:"Sky Sports" },
    { day:"Sat 24 Oct", time:"12:30", h:"AVL", a:"MCI", tv:"TNT Sports" },
    { day:"Sat 24 Oct", time:"15:00", h:"ARS", a:"EVE" },
    { day:"Sat 24 Oct", time:"15:00", h:"COV", a:"FUL" },
    { day:"Sat 24 Oct", time:"17:30", h:"CHE", a:"TOT", tv:"Sky Sports" },
    { day:"Sun 25 Oct", time:"14:00", h:"CRY", a:"NEW", tv:"Sky Sports" },
    { day:"Sun 25 Oct", time:"14:00", h:"HUL", a:"BRE", tv:"Sky Sports" },
    { day:"Sun 25 Oct", time:"14:00", h:"LIV", a:"BHA", tv:"Sky Sports" },
    { day:"Sun 25 Oct", time:"14:00", h:"MUN", a:"BOU", tv:"Sky Sports" },
    { day:"Sun 25 Oct", time:"16:30", h:"SUN", a:"LEE", tv:"Sky Sports" },
  ],
  // pos: 1 GK, 2 DEF, 3 MID, 4 FWD. slot 1-11 start, 12-15 bench.
  picks: [
    { name:"Lammens", team:"MUN", pos:1, slot:1 },
    { name:"Gvardiol", team:"MCI", pos:2, slot:2 },
    { name:"Muñoz", team:"NFO", pos:2, slot:3 },
    { name:"Calafiori", team:"ARS", pos:2, slot:4 },
    { name:"Cherki", team:"MCI", pos:3, slot:5 },
    { name:"Ødegaard", team:"ARS", pos:3, slot:6 },
    { name:"Lerma", team:"CRY", pos:3, slot:7 },
    { name:"Yates", team:"NFO", pos:3, slot:8 },
    { name:"Haaland", team:"MCI", pos:4, slot:9, cap:true },
    { name:"Isak", team:"LIV", pos:4, slot:10, vice:true },
    { name:"Gyökeres", team:"ARS", pos:4, slot:11 },
    { name:"Dubravka", team:"TOT", pos:1, slot:12 },
    { name:"Thomas", team:"COV", pos:2, slot:13 },
    { name:"Gomez", team:"BHA", pos:3, slot:14 },
    { name:"Diop", team:"IPS", pos:2, slot:15 },
  ]
};

// ---------- State ----------
const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k) || "" } catch { return "" } }, set(k,v){ try { localStorage.setItem(k,v) } catch {} } };
let state = null;

// ---------- Rendering ----------
function teamName(code){ return (state.teams[code] || code); }

function render(){
  const picks = state.picks;
  const starters = picks.filter(p => p.slot <= 11);
  const total = starters.reduce((s,p) => s + (p.points||0) * (p.cap ? 2 : 1), 0);
  $("#total").textContent = total;
  $("#gwLabel").textContent = "Gameweek " + state.gw;
  $("#deadline").textContent = state.deadline ? "Deadline " + state.deadline : "";
  $("#manager").textContent = state.manager || "";
  $("#teamName").textContent = state.teamName || "FPL";
  document.title = state.teamName || "FPL";
  $("#capName").textContent = (picks.find(p => p.cap) || {}).name || "";
  const played = starters.filter(p => p.minutes > 0 || p.finished).length;
  $("#played").textContent = played;
  $("#toPlay").textContent = 11 - played;
  const st = $("#status");
  st.className = "status " + (state.live ? "" : state.offline ? "off" : "snap");
  st.textContent = state.live ? "Live" : state.offline ? "Offline, last saved" : "Snapshot";

  // Fixtures grouped by day
  const byDay = new Map();
  state.fixtures.forEach(f => { if(!byDay.has(f.day)) byDay.set(f.day, []); byDay.get(f.day).push(f); });
  let html = "";
  for (const [day, list] of byDay){
    html += `<section class="slot"><h2><span>${day}</span></h2>`;
    for (const f of list){
      const mine = picks.filter(p => p.team === f.h || p.team === f.a).sort((a,b) => a.slot - b.slot);
      const hasScore = f.hs != null;
      const mid = hasScore
        ? `${f.hs} <span style="color:var(--ink-dim)">–</span> ${f.as}<small>${f.finished ? "FT" : f.minutes != null ? f.minutes + "'" : f.time}</small>`
        : `${f.time}<small>${f.tv || ""}</small>`;
      html += `<article class="fx ${mine.length ? "mine" : ""}">
        <div class="team">${teamName(f.h)}</div>
        <div class="mid ${hasScore && !f.finished ? "live" : ""}">${mid}</div>
        <div class="team a">${teamName(f.a)}</div>`;
      html += mine.length
        ? `<div class="picks">${mine.map(chip).join("")}</div>`
        : `<div class="none">None of your players</div>`;
      html += `</article>`;
    }
    html += `</section>`;
  }
  $("#fixtures").innerHTML = html;

  // Squad pitch
  const rows = [1,2,3,4].map(pos => starters.filter(p => p.pos === pos));
  $("#squad").innerHTML = `<div class="pitch">${rows.map(r => `<div class="row">${r.map(shirt).join("")}</div>`).join("")}</div>
    <div class="benchline"><h3>Bench</h3><div class="row">${picks.filter(p => p.slot > 11).map(shirt).join("")}</div></div>`;
}
function chip(p){
  const pts = p.points != null ? (p.cap ? p.points*2 : p.points) : "";
  return `<span class="pick ${p.slot > 11 ? "bench" : ""}">${p.cap ? '<span class="cap">C</span>' : p.vice ? '<span class="cap v">V</span>' : ""}${p.name}<span class="pts">${pts}</span></span>`;
}
function shirt(p){
  const f = state.fixtures.find(x => x.h === p.team || x.a === p.team);
  const fix = f ? (f.h === p.team ? f.a + " (H)" : f.h + " (A)") : "";
  const pts = p.points != null ? (p.cap ? p.points*2 : p.points) : "–";
  return `<div class="shirt"><div class="p">${pts}${p.cap ? '<span class="cap">C</span>' : p.vice ? '<span class="cap v">V</span>' : ""}</div><div class="n">${p.name}</div><div class="f">${fix}</div></div>`;
}

// ---------- Live data via Worker proxy ----------
async function getJSON(base, path){
  const r = await fetch(base.replace(/\/$/, "") + "/" + path);
  if(!r.ok) throw new Error(path + " returned " + r.status);
  return r.json();
}
async function loadLive(base, entry){
  const boot = await getJSON(base, "bootstrap-static/");
  const gwObj = boot.events.find(e => e.is_current) || boot.events.find(e => e.is_next);
  const gw = gwObj.id;
  const [fixtures, live, picks, me] = await Promise.all([
    getJSON(base, `fixtures/?event=${gw}`),
    getJSON(base, `event/${gw}/live/`),
    getJSON(base, `entry/${entry}/event/${gw}/picks/`),
    getJSON(base, `entry/${entry}/`)
  ]);
  const teams = {}; const code = {};
  boot.teams.forEach(t => { teams[t.short_name] = t.name; code[t.id] = t.short_name; });
  const el = {}; boot.elements.forEach(e => el[e.id] = e);
  const liveStats = {}; live.elements.forEach(e => liveStats[e.id] = e.stats);
  const fmtDay = d => d.toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" });
  const fmtTime = d => d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
  const fx = fixtures.sort((a,b) => new Date(a.kickoff_time) - new Date(b.kickoff_time)).map(f => {
    const d = new Date(f.kickoff_time);
    return { day: fmtDay(d), time: fmtTime(d), h: code[f.team_h], a: code[f.team_a],
      hs: f.started ? f.team_h_score : null, as: f.started ? f.team_a_score : null,
      minutes: f.started && !f.finished ? f.minutes : null, finished: f.finished_provisional || f.finished };
  });
  const pk = picks.picks.map(p => {
    const e = el[p.element]; const s = liveStats[p.element] || {};
    const team = code[e.team];
    const f = fx.find(x => x.h === team || x.a === team);
    return { name: e.web_name, team, pos: e.element_type, slot: p.position, cap: p.is_captain, vice: p.is_vice_captain,
      points: s.total_points ?? 0, minutes: s.minutes ?? 0, finished: f?.finished };
  });
  const dl = new Date(gwObj.deadline_time);
  return { gw, deadline: fmtDay(dl) + ", " + fmtTime(dl), manager: me.player_first_name + " " + me.player_last_name, teamName: me.name,
    teams, fixtures: fx, picks: pk, live: true };
}

async function boot(){
  const base = store.get("proxy"), entry = store.get("entry");
  if(base && entry){
    try {
      state = await loadLive(base, entry);
      store.set("lastLive", JSON.stringify(state));
    } catch (err) {
      const cached = store.get("lastLive");
      state = cached ? { ...JSON.parse(cached), live:false, offline:true } : { ...SNAP };
      console.warn(err);
    }
  } else {
    state = { ...SNAP };
  }
  render();
}

// ---------- UI wiring ----------
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  $("#fixtures").hidden = t.dataset.view !== "fixtures";
  $("#squad").hidden = t.dataset.view !== "squad";
}));
$("#openSettings").addEventListener("click", () => {
  $("#proxy").value = store.get("proxy"); $("#entry").value = store.get("entry"); $("#msg").textContent = "";
  $("#sheet").hidden = false;
});
$("#sheet").addEventListener("click", e => { if(e.target === $("#sheet")) $("#sheet").hidden = true; });
$("#useSnapshot").addEventListener("click", () => { store.set("proxy",""); store.set("entry",""); $("#sheet").hidden = true; boot(); });
$("#settingsForm").addEventListener("submit", async e => {
  e.preventDefault();
  const base = $("#proxy").value.trim(), entry = $("#entry").value.trim();
  if(!/^https?:\/\//.test(base) || !/^\d+$/.test(entry)){ $("#msg").textContent = "Enter a full Worker URL and a numeric manager ID."; return; }
  $("#msg").textContent = "Connecting…";
  try {
    state = await loadLive(base, entry);
    store.set("proxy", base); store.set("entry", entry); store.set("lastLive", JSON.stringify(state));
    $("#sheet").hidden = true; render();
  } catch (err) { $("#msg").textContent = "Could not reach the API through that Worker. Check the URL and that the Worker is deployed."; }
});

boot();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// Refresh every 60 s while live
setInterval(() => { if(state?.live) boot(); }, 60000);
</script>
</body>
</html>
